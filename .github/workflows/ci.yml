name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Ruff
        run: pip install ruff==0.9.3
      - name: ruff check
        run: ruff check backend etl

  test-etl:
    name: Tests ETL (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: etl/requirements.txt
      - name: Instalar dependencias
        run: pip install -r etl/requirements.txt
      - name: pytest
        working-directory: etl
        run: pytest -q

  test-backend:
    name: Tests backend (pytest, con Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Mismo flujo que el README: Postgres + ETL cargando el CSV + pytest dentro del contenedor api.
      # Los tests de endpoints necesitan datos; el ETL los carga antes de correr la suite.
      - name: Preparar .env
        run: cp .env.example .env
      - name: Levantar base de datos
        run: docker compose up -d --wait db
      - name: Cargar datos (ETL)
        run: docker compose run --rm etl
      - name: pytest backend
        run: docker compose run --rm --no-deps api pytest -q
      - name: Logs si falla
        if: failure()
        run: docker compose logs --no-color
      - name: Apagar servicios
        if: always()
        run: docker compose down -v

  frontend:
    name: Frontend (lint y tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Detectar frontend
        id: front
        run: echo "existe=$([ -f frontend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        if: steps.front.outputs.existe == 'true'
        with:
          run_install: false
      - uses: actions/setup-node@v4
        if: steps.front.outputs.existe == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Instalar dependencias
        if: steps.front.outputs.existe == 'true'
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Lint (ESLint)
        if: steps.front.outputs.existe == 'true'
        working-directory: frontend
        run: pnpm run --if-present lint
      - name: Tests (Vitest)
        if: steps.front.outputs.existe == 'true'
        working-directory: frontend
        run: pnpm run --if-present test
