services:
  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      retries: 10

  api:
    build: ./api
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  etl:
    build: ./etl
    env_file: .env
    volumes:
      - ./datos:/datos:ro
    depends_on:
      db:
        condition: service_healthy
    profiles: ["etl"]   # se ejecuta bajo demanda: docker compose run --rm etl

volumes:
  pgdata:
